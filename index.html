<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracking Dashboard</title>
    <link rel="shortcut icon" href="./images/favicon-32x32 (1).png" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <main class="dashboard-body">
            <div class="dashboard-report">
                <div class="report-person">
                    <div class="person-avatar">
                        <img src="./images/image-jeremy.png" alt="Jeremy">
                    </div>
                    <div class="person-block">
                        <p class="person-text">Report for</p>
                        <h1 class="person-name">Jeremy Robson</h1>
                    </div>
                </div>
                <ul class="report-list">
                    <li class="report-item">
                        <button class="report-button">Daily</button>
                    </li>
                    <li class="report-item">
                        <button class="report-button">Weekly</button>
                    </li>
                    <li class="report-item">
                        <button class="report-button">Monthly</button>
                    </li>
                </ul>
            </div>
            <div class="dashboard-results">
                <div class="results-row">
                    <div class="results-column results-column_work">
                        <div class="results-card">
                            <div class="card-result_info">
                                <p class="card-result_text">Work</p>
                                <button class="card-result_ellipsis">
                                    <img src="./images/icon-ellipsis.svg" alt="">
                                </button>
                            </div>
                            <div class="card-result_times">
                                <p class="card-result_current-time">32hrs</p>
                                <p class="card-result_past-time">Last Week - 36hrs</p>
                            </div>
                        </div>
                    </div>
                    <div class="results-column results-column_play">
                        <div class="results-card">
                            <div class="card-result_info">
                                <p class="card-result_text">Play</p>
                                <button class="card-result_ellipsis">
                                    <img src="./images/icon-ellipsis.svg" alt="">
                                </button>
                            </div>
                            <div class="card-result_times">
                                <p class="card-result_current-time">10hrs</p>
                                <p class="card-result_past-time">Last Week - 8hrs</p>
                            </div>
                        </div>
                    </div>
                    <div class="results-column results-column_study">
                        <div class="results-card">
                            <div class="card-result_info">
                                <p class="card-result_text">Study</p>
                                <button class="card-result_ellipsis">
                                    <img src="./images/icon-ellipsis.svg" alt="">
                                </button>
                            </div>
                            <div class="card-result_times">
                                <p class="card-result_current-time">4hrs</p>
                                <p class="card-result_past-time">Last Week - 7hrs</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="results-row">
                    <div class="results-column results-column_exercise">
                        <div class="results-card">
                            <div class="card-result_info">
                                <p class="card-result_text">Exercise</p>
                                <button class="card-result_ellipsis">
                                    <img src="./images/icon-ellipsis.svg" alt="">
                                </button>
                            </div>
                            <div class="card-result_times">
                                <p class="card-result_current-time">4hrs</p>
                                <p class="card-result_past-time">Last Week - 5hrs</p>
                            </div>
                        </div>
                    </div>
                    <div class="results-column results-column_social">
                        <div class="results-card">
                            <div class="card-result_info">
                                <p class="card-result_text">Social</p>
                                <button class="card-result_ellipsis">
                                    <img src="./images/icon-ellipsis.svg" alt="">
                                </button>
                            </div>
                            <div class="card-result_times">
                                <p class="card-result_current-time">5hrs</p>
                                <p class="card-result_past-time">Last Week - 10hrs</p>
                            </div>
                        </div>
                    </div>
                    <div class="results-column results-column_self-care">
                        <div class="results-card">
                            <div class="card-result_info">
                                <p class="card-result_text">Self Care</p>
                                <button class="card-result_ellipsis">
                                    <img src="./images/icon-ellipsis.svg" alt="">
                                </button>
                            </div>
                            <div class="card-result_times">
                                <p class="card-result_current-time">2hrs</p>
                                <p class="card-result_past-time">Last Week - 2hrs</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>


    <script src="./js/script.js"></script>
</body>
</html>
