<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracking Dashboard</title>
    <link rel="shortcut icon" href="./images/favicon-32x32 (1).png" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <main class="dashboard-body">
            <div class="dashboard-report">
                <div class="report-person">
                    <div class="person-avatar">
                        <img src="./images/image-jeremy.png" alt="Jeremy">
                    </div>
                    <div class="person-block">
                        <p class="person-text">Report for</p>
                        <h1 class="person-name">Jeremy Robson</h1>
                    </div>
                </div>
                <ul class="report-list">
                    <li class="report-item">
                        <button class="report-button">Daily</button>
                    </li>
                    <li class="report-item">
                        <button class="report-button">Weekly</button>
                    </li>
                    <li class="report-item">
                        <button class="report-button">Monthly</button>
                    </li>
                </ul>
            </div>
            <div class="dashboard-results">
                <div class="results-row">
                    
                </div>
            </div>
        </main>
    </div>


    <script src="./js/script.js"></script>
</body>
</html>
